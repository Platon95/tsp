name: Поиск фото (временно)
on:
  push:
    branches: [candidates]
    paths: [tools/find_images.py, .github/workflows/find-images.yml]
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/find_images.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates && git commit -m "Кандидаты фото" && git push
